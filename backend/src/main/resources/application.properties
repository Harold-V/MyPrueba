spring.application.name=myprueba
spring.datasource.url=jdbc:sqlite:${APP_DB_PATH:./data/myprueba.db}?journal_mode=WAL&busy_timeout=5000&foreign_keys=true
spring.datasource.hikari.maximum-pool-size=4
spring.flyway.locations=classpath:db/migration
spring.mvc.problemdetails.enabled=true
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
management.endpoints.web.exposure.include=health
app.session.cookie-secure=${APP_COOKIE_SECURE:true}
app.zone=America/Bogota
app.currency=COP
